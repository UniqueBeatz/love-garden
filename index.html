<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Garden</title>
  <style>
    :root {
      --bg1: #fff4f7;
      --bg2: #ffe9d3;
      --panel: rgba(255,255,255,0.7);
      --card-front: #ff9bb4;
      --card-back: #fff;
      --accent: #ff5c8a;
      --accent-2: #ffb367;
      --text: #4a2d35;
      --shadow: rgba(95, 52, 70, 0.16);
      --match: #b5f1d4;
      --danger: #f06b8d;
      --gold: #ffd970;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.8), transparent 36%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(92vw, 760px);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      box-shadow: 0 24px 60px var(--shadow);
      padding: 26px 22px 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      margin: 0;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-shadow: 0 4px 12px rgba(255, 92, 138, 0.12);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .timer {
      min-width: 120px;
      text-align: center;
      color: var(--danger);
    }

    .board-wrap {
      position: relative;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
    }

    .card {
      height: 120px;
      perspective: 900px;
      cursor: pointer;
      user-select: none;
      border: none;
      background: transparent;
      padding: 0;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s ease;
      border-radius: 18px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backface-visibility: hidden;
      border-radius: 18px;
      box-shadow: 0 12px 25px rgba(54, 21, 33, 0.08);
    }

    .card-front {
      background: linear-gradient(135deg, #ffb2c8, #ff8aa7);
      color: white;
      font-size: 2.2rem;
      font-weight: 900;
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #ffffff, #fffaf8);
      border: 2px solid rgba(255, 150, 180, 0.45);
      text-align: center;
      padding: 10px;
    }

    .card-back .emoji {
      font-size: 2.2rem;
      line-height: 1;
      display: block;
      margin-bottom: 6px;
    }

    .card-back .label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }

    .card.matched .card-back {
      background: linear-gradient(180deg, #eafff3, #d5f8e5);
      border-color: rgba(126, 214, 163, 0.8);
    }

    .card:disabled {
      cursor: default;
    }

    .win-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.82);
      border-radius: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .win-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .win-box {
      width: min(88%, 450px);
      background: linear-gradient(180deg, #fffdfd, #fff5f8);
      border: 2px solid rgba(255, 143, 175, 0.45);
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(120, 51, 74, 0.12);
    }

    .win-box h2 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 2vw, 2.2rem);
      color: var(--accent);
    }

    .win-box p {
      margin: 0;
      line-height: 1.6;
      font-size: 1.02rem;
      color: var(--text);
    }

    .win-box button {
      margin-top: 20px;
      background: linear-gradient(135deg, var(--accent), #ff8c5d);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 106, 146, 0.2);
    }

    @media (max-width: 620px) {
      .scene {
        padding: 18px 14px 12px;
      }

      .game-board {
        gap: 10px;
      }

      .card {
        height: 96px;
      }

      .card-back .label {
        font-size: 0.6rem;
      }

      .card-front {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="topbar">
      <h1>Love Garden</h1>
      <div class="controls">
        <div class="pill">Moves: <span id="moves">0</span></div>
        <div class="pill timer">⏳ <span id="timer">75</span>s</div>
        <button class="pill" id="restart" type="button">Restart</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="game-board" id="board"></div>

      <div class="win-screen" id="winScreen" aria-live="polite">
        <div class="win-box">
          <h2 id="resultTitle">You made her smile 💖</h2>
          <p id="resultText">Every memory matched. The garden is glowing again.</p>
          <button id="playAgain" type="button">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const symbols = [
      { emoji: "🌹", label: "Rose" },
      { emoji: "💖", label: "Love" },
      { emoji: "🌙", label: "Moonlight" },
      { emoji: "🍓", label: "Berry" },
      { emoji: "🎀", label: "Ribbon" },
      { emoji: "🌷", label: "Tulip" },
      { emoji: "🍰", label: "Cake" },
      { emoji: "🌻", label: "Sunflower" }
    ];

    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const timerEl = document.getElementById("timer");
    const winScreen = document.getElementById("winScreen");
    const resultTitle = document.getElementById("resultTitle");
    const resultText = document.getElementById("resultText");
    const restartBtn = document.getElementById("restart");
    const playAgainBtn = document.getElementById("playAgain");

    let deck = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let timeLeft = 75;
    let timerId = null;

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createDeck() {
      deck = shuffle([...symbols, ...symbols]).map((item, index) => ({
        ...item,
        id: index
      }));
    }

    function buildBoard() {
      board.innerHTML = "";
      deck.forEach((item) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.name = item.label;
        card.setAttribute("aria-label", item.label);
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-front">♥</div>
            <div class="card-face card-back">
              <span class="emoji">${item.emoji}</span>
              <span class="label">${item.label}</span>
            </div>
          </div>
        `;

        card.addEventListener("click", () => flipCard(card));
        board.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard || card === firstCard || card.classList.contains("matched") || card.classList.contains("flipped")) {
        return;
      }

      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves++;
      movesEl.textContent = moves;

      if (firstCard.dataset.name === secondCard.dataset.name) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        firstCard = null;
        secondCard = null;
        matches++;

        if (matches === symbols.length) {
          endGame(true);
        }
        return;
      }

      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");
        firstCard = null;
        secondCard = null;
        lockBoard = false;
      }, 700);
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerId);
          endGame(false);
        }
      }, 1000);
    }

    function endGame(won) {
      clearInterval(timerId);
      winScreen.classList.add("visible");
      if (won) {
        resultTitle.textContent = "Garden of love complete 💖";
        resultText.textContent = `You matched every bloom in ${moves} moves. The whole garden is glowing for you two.`;
      } else {
        resultTitle.textContent = "A little more time for date night 🌙";
        resultText.textContent = "You ran out of time, but the garden still remembers your love. Try again!";
      }
    }

    function resetGame() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      moves = 0;
      matches = 0;
      timeLeft = 75;
      movesEl.textContent = "0";
      timerEl.textContent = "75";
      winScreen.classList.remove("visible");
      createDeck();
      buildBoard();
      startTimer();
    }

    restartBtn.addEventListener("click", resetGame);
    playAgainBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
